<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="恩典島：60 則兒童聖經故事蓋成的 3D 玩具小城，含和合本金句、注音、人物索引與聖經時間軸。">
<title>恩典島</title>
<meta name="author" content="@ritakao">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: full-bleed 3D toy island city; UI floats on top as chunky "wooden block" cards — brand top-left, search top-right, story panel right, controls bottom-left. */
:root{
  --bg:#f7f2e8;
  --card:#fffdf8;
  --ink:#2c2a3a;
  --ink-soft:#6c6779;
  --edge:#2c2a3a;
  --accent:#2f6fd1;
  --sun:#f4bd3c;
  --leaf:#4f9a5c;
  --chip:#efe9dc;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Sans TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171a26;--card:#232736;--ink:#f2eee6;--ink-soft:#aaa6bb;--edge:#07080e;
    --accent:#86b2ff;--sun:#f6c650;--leaf:#7fc58b;--chip:#2e3346;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171a26;--card:#232736;--ink:#f2eee6;--ink-soft:#aaa6bb;--edge:#07080e;
  --accent:#86b2ff;--sun:#f6c650;--leaf:#7fc58b;--chip:#2e3346;color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
#sky{position:fixed;inset:0;z-index:0;transition:background 1.2s}
#skyFx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 24%, rgba(255,246,220,.95) 0%, rgba(255,226,180,.6) 28%, rgba(252,222,196,.32) 60%, rgba(240,226,214,.18) 100%)}
#scene{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.hovering{cursor:pointer}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.isl{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-50%,-100%);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:14px;line-height:1;
  padding:6px 10px 6px 8px;border:2px solid var(--edge);border-radius:999px;
  background:var(--card);color:var(--ink);box-shadow:2px 3px 0 var(--edge);cursor:pointer;
  transition:opacity .4s, background .2s}
.isl:hover,.isl:focus-visible{background:var(--sun);color:#2c2a3a;outline:none}
.isl .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--edge);flex:none}
.isl small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--ink-soft)}
.isl:hover small{color:#2c2a3a}
.isl.dim{opacity:.35}
.isl.home{background:var(--sun);color:#2c2a3a}
.isl.home small{color:#5a4a20}
#tip{position:fixed;z-index:5;pointer-events:none;left:0;top:0;transform:translate(14px,14px);
  background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:10px;
  padding:6px 10px;font-weight:700;box-shadow:2px 3px 0 var(--edge);max-width:240px}
#tip small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}

.ui{position:fixed;inset:0;z-index:3;pointer-events:none;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,380px);grid-template-rows:auto minmax(0,1fr) auto auto;gap:12px;
  padding-top:max(16px, env(safe-area-inset-top, 0px));padding-bottom:max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ui>*{pointer-events:auto;min-width:0}
.block{background:var(--card);border:2px solid var(--edge);border-radius:16px;box-shadow:3px 4px 0 var(--edge)}

.brand{grid-column:1;grid-row:1;justify-self:start;align-self:start;display:flex;gap:12px;align-items:center;padding:10px 16px 10px 12px}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--display);font-size:28px;line-height:1.05;letter-spacing:.06em}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:12px}
.brand .clock{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}

.search{grid-column:2;grid-row:1;align-self:start;position:relative}
.search label{position:absolute;left:-9999px}
.search .field{display:flex;align-items:center;gap:8px;padding:8px 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;padding:4px 0}
.search input::placeholder{color:var(--ink-soft)}
.search .field:focus-within{box-shadow:3px 4px 0 var(--accent)}
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:50vh;overflow:auto;padding:6px;display:grid;gap:2px}
.results button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-radius:10px}
.results button:hover,.results button:focus-visible{background:var(--chip)}
.results .n{grid-row:span 2;align-self:center}
.results .t{font-weight:700}
.results .s{font-size:12px;color:var(--ink-soft)}
.results .empty{padding:10px;color:var(--ink-soft)}

.panel{grid-column:2;grid-row:2;display:flex;flex-direction:column;overflow:hidden}
.panel .scroll{overflow:auto;padding:18px 18px 20px;display:grid;gap:14px;align-content:start}
.panel h2{word-break:keep-all;margin:0;font-family:var(--display);font-size:24px;line-height:1.25;text-wrap:balance}
.panel h3{margin:0;font-size:12px;letter-spacing:.12em;color:var(--ink-soft);font-weight:700}
.panel p{margin:0}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;border:1.5px solid var(--edge);font-size:12px;font-weight:700;background:var(--chip);color:var(--ink)}
.pill.ot{background:#f7dc93;color:#2c2a3a}
.pill.nt{background:#bcd6ff;color:#2c2a3a}
.back{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);justify-self:start}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.lede{color:var(--ink);font-size:15px;max-width:34em}
.n{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 4px;border-radius:9px;border:2px solid var(--edge);
  font-family:var(--display);font-weight:700;font-size:14px;background:var(--sun);color:#2c2a3a;font-variant-numeric:tabular-nums}
.n.nt{background:#bcd6ff}
.list{display:grid;gap:8px}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:start;
  padding:10px 12px;border:2px solid var(--edge);border-radius:12px;background:var(--card);transition:transform .15s, box-shadow .15s}
.item:hover,.item:focus-visible{transform:translate(-1px,-2px);box-shadow:2px 3px 0 var(--edge)}
.item .n{grid-row:span 2}
.item b{font-size:15px}
.item span{font-size:12.5px;color:var(--ink-soft)}
.today{background:linear-gradient(0deg,var(--card),var(--card));position:relative}
.today::before{content:"今日故事";position:absolute;top:-10px;right:12px;font-size:11px;font-weight:700;letter-spacing:.08em;
  background:var(--accent);color:var(--card);padding:1px 8px;border-radius:999px;border:1.5px solid var(--edge)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:2px solid var(--edge);
  font-weight:700;font-size:13px;background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--edge)}
.btn:hover{background:var(--chip)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--card)}
.links{display:grid;gap:8px}
.link{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--chip)}
.link:hover,.link:focus-visible{outline:2px solid var(--sun)}
.link svg{flex:none;margin-top:3px}
.link b{display:block;font-size:13.5px}
.link span{font-size:12.5px;color:var(--ink-soft)}
.how{display:grid;gap:6px;padding:0;margin:0;list-style:none;font-size:13px;color:var(--ink-soft)}
.how li{padding-left:14px;position:relative}
.how li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:2px;background:var(--sun);border:1.5px solid var(--edge)}
.how b{color:var(--ink)}
.grid-isl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid-isl button{all:unset;cursor:pointer;padding:7px 10px;border-radius:10px;background:var(--chip);font-size:13px;display:flex;justify-content:space-between;gap:6px}
.grid-isl button:hover,.grid-isl button:focus-visible{outline:2px solid var(--edge)}
.grid-isl em{font-style:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.foot{font-size:11.5px;color:var(--ink-soft);border-top:1.5px dashed var(--ink-soft);padding-top:10px}
.foot a{color:var(--accent)}

.controls{grid-column:1;grid-row:4;justify-self:start;align-self:end;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;max-width:100%}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-weight:700;font-size:13px;color:var(--ink)}
.seg button+button{border-left:2px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--sun);color:#2c2a3a}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.toggle[aria-pressed="true"]{background:var(--sun);color:#2c2a3a}
.time{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.time input{width:130px;accent-color:var(--accent)}
.time output{font-variant-numeric:tabular-nums;min-width:3.2em}
.lambnote{font-size:12px;color:var(--ink-soft);max-width:220px}
.handle{all:unset;display:none}

.timeline{grid-column:1 / 3;grid-row:3;align-self:end;padding:10px 14px 12px;display:grid;gap:8px}
.tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tl-head h3{margin:0;font-family:var(--display);font-size:16px;letter-spacing:.04em}
.tl-now{font-size:13px;color:var(--ink-soft);min-width:0;flex:1}
.tl-now b{color:var(--ink)}
.tl-note{font-size:11px;color:var(--ink-soft)}
.tl-scroll{overflow-x:auto;padding-bottom:2px}
.tl-track{display:flex;gap:4px;min-width:100%;width:max-content}
.era{flex:var(--n) 0 auto;min-width:max-content;border:1.5px solid var(--edge);border-radius:10px;background:var(--era);color:#2c2a3a;padding:4px 4px 6px;display:grid;gap:4px}
.era>span{display:grid;font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap;padding:0 4px;min-width:0}
.era>span small{font-size:10.5px;font-weight:500;opacity:.78;font-variant-numeric:tabular-nums}
.dots{display:flex;justify-content:space-around;align-items:center;gap:3px;height:22px;padding:0 2px}
.dot{all:unset;cursor:pointer;width:10px;height:10px;border-radius:50%;background:#fffdf8;border:2px solid #2c2a3a;flex:none;transition:transform .15s}
.dot:hover,.dot:focus-visible{transform:scale(1.35)}
.dot:focus-visible{outline:2px solid #2f6fd1;outline-offset:2px}
.dot.on{background:#2f6fd1;transform:scale(1.55)}
.dot.is-today{background:#f4bd3c}
.dot.on.is-today{background:#2f6fd1}
.btn.playing{background:var(--sun);color:#2c2a3a}

.ptools{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 14px 0}
.ptools .btn{padding:4px 10px;font-size:12.5px}
.ptools .btn[aria-pressed="true"]{background:var(--sun);color:#2c2a3a}
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .05em}
.zb{display:inline-flex;align-items:center;font-family:var(--body);font-weight:500;font-size:clamp(10px,.46em,13px);line-height:1;margin-left:.1em;color:var(--ink)}
.zs{display:inline-flex;flex-direction:column;align-items:center}
.zs i,.zb .tn{font-style:normal;line-height:1.02}
.zs .lt{line-height:.55}
.zb .tn{margin-left:.06em}
.panel.zy h2{font-size:25px;line-height:2.1}
.panel.zy .lede{font-size:19px;line-height:2.25}
.panel.zy .verse blockquote{font-size:20px;line-height:2.25}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:1.5px solid var(--edge);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:700}
.pchip:hover,.pchip:focus-visible{background:var(--chip);box-shadow:2px 2px 0 var(--edge)}
.pchip .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:#f7dc93;color:#2c2a3a;border:1.5px solid var(--edge);font-size:13px}
.pchip.nt .av{background:#bcd6ff}
.pchip em{font-style:normal;font-weight:400;color:var(--ink-soft);font-size:11px;font-variant-numeric:tabular-nums}
.dot.hit{box-shadow:0 0 0 3px #f4bd3c}
.scenes{display:grid;gap:10px}
.panel h3.part{font-family:var(--display);font-size:18px;letter-spacing:.04em;color:var(--ink);padding-top:6px;border-top:1.5px dashed var(--ink-soft)}
.panel.zy h3.part{font-size:20px;line-height:2.1}
.scene{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--chip)}
.scene svg{width:52px;height:52px}
.scene b{display:block;font-family:var(--display);font-size:16px}
.scene p{margin:2px 0 6px;font-size:13px;color:var(--ink-soft)}
.scene blockquote{margin:0 0 4px;font-family:var(--display);font-size:14.5px;line-height:1.7;color:var(--ink)}
.scene a{font-size:12px;color:var(--accent);font-weight:700}
.panel.zy .scene b{font-size:19px;line-height:2.1}
.panel.zy .scene p,.panel.zy .scene blockquote{font-size:16px;line-height:2.2}
.verse{margin:0;padding:14px 16px 12px;border-radius:14px;background:var(--chip);border:2px dashed var(--ink-soft);display:grid;gap:8px}
.verse blockquote{margin:0;font-family:var(--display);font-size:18px;line-height:1.7;color:var(--ink)}
.verse figcaption{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft)}
.verse figcaption a{color:var(--accent);font-weight:700}
.copy{all:unset;cursor:pointer;margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;border:1.5px solid var(--edge);background:var(--card);color:var(--ink)}
.copy:focus-visible{outline:2px solid var(--accent)}
.results .v{grid-column:2;font-size:12px;color:var(--ink);font-family:var(--display)}
.results mark{background:var(--sun);color:#2c2a3a;border-radius:3px;padding:0 1px}

@media (max-width:760px){
  .ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:8px}
  .timeline{grid-row:5;grid-column:1;padding:8px 10px}
  .tl-note{display:none}
  .brand{grid-row:1;grid-column:1;padding:8px 12px}
  .brand p{font-size:11px}
  .brand h1{font-size:22px}
  .search{grid-row:2;grid-column:1}
  .controls{grid-row:3;grid-column:1;flex-wrap:nowrap;overflow-x:auto;justify-self:stretch;padding:8px 10px}
  .controls>*{flex:none}
  .lambnote{display:none}
  .panel{grid-row:6;grid-column:1;max-height:36vh}
  .panel.collapsed .scroll{display:none}
  .handle{display:flex;cursor:pointer;justify-content:center;padding:6px 0 0}
  .handle::before{content:"";width:44px;height:5px;border-radius:5px;background:var(--ink-soft)}
  .isl{font-size:12px;padding:4px 8px 4px 6px}
  .isl small{display:none}
}
@media (prefers-reduced-motion: reduce){ .item,.isl{transition:none} }
</style>
</head>
<body>
<div id="sky"></div>
<div id="skyFx" style="opacity:0"></div>
<canvas id="scene" aria-label="恩典島 3D 互動地圖：拖曳旋轉，滾輪縮放，點建築看故事"></canvas>
<div id="labels"></div>
<div id="tip" hidden></div>

<div class="ui">
  <header class="brand block">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <polygon points="22,3 38.5,12.5 38.5,31.5 22,41 5.5,31.5 5.5,12.5" fill="#8cc66d" stroke="#2c2a3a" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="19.5" y="11" width="5" height="22" rx="1.5" fill="#f4bd3c" stroke="#2c2a3a" stroke-width="2"/>
      <rect x="13" y="17" width="18" height="5" rx="1.5" fill="#f4bd3c" stroke="#2c2a3a" stroke-width="2"/>
    </svg>
    <div>
      <h1>恩典島</h1>
      <p>60 則兒童聖經故事・15 座島 ・ 台北 <span class="clock" id="clock">--:--</span> <span id="period"></span></p>
    </div>
  </header>

  <div class="search">
    <div class="field block">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      <label for="q">搜尋故事</label>
      <input id="q" type="search" autocomplete="off" placeholder="找故事：大衛、方舟、禱告、饒恕…">
    </div>
    <div class="results block" id="results" hidden></div>
  </div>

  <aside class="panel block" id="panel" aria-live="polite">
    <button class="handle" id="handle" aria-label="展開或收合故事面板"></button>
    <div class="ptools">
      <button class="btn" id="peopleBtn">人物</button>
      <button class="btn" id="zyBtn" aria-pressed="false" aria-label="顯示注音">ㄅㄆㄇ 注音</button>
    </div>
    <div class="scroll" id="panelBody"></div>
  </aside>

  <section class="timeline block" aria-label="聖經時間軸">
    <div class="tl-head">
      <h3>聖經時間軸</h3>
      <button class="btn" id="playBtn" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M7 4l13 8-13 8z" fill="currentColor"/></svg>
        <span id="playLabel">依年代播放</span>
      </button>
      <span class="tl-now" id="tlNow">點一個圓點，跳到那個年代的故事</span>
      <span class="tl-note">年代為傳統估算，部分年代學界看法不一</span>
    </div>
    <div class="tl-scroll" id="tlScroll"><div class="tl-track" id="tlTrack"></div></div>
  </section>

  <div class="controls block">
    <div class="seg" role="group" aria-label="篩選聖經">
      <button id="f-all" aria-pressed="true">全部</button>
      <button id="f-ot" aria-pressed="false">舊約</button>
      <button id="f-nt" aria-pressed="false">新約</button>
    </div>
    <button class="btn toggle" id="graceBtn" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18C6 6 18 6 21 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="3" cy="18" r="2" fill="currentColor"/><circle cx="21" cy="18" r="2" fill="currentColor"/></svg>
      恩典線
    </button>
    <button class="btn" id="lambBtn">
      <svg width="18" height="16" viewBox="0 0 26 22" aria-hidden="true"><ellipse cx="12" cy="11" rx="9" ry="7" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="21" cy="8" r="3.4" fill="currentColor"/><path d="M7 17v4M16 17v4" stroke="currentColor" stroke-width="2"/></svg>
      找小羊
    </button>
    <div class="time">
      <label for="hour">時光</label>
      <input id="hour" type="range" min="0" max="24" step="0.25" value="12">
      <output id="hourOut" for="hour">即時</output>

const VERSE={"1": ["創 1:1", "Gen 1:1", "起初，神創造天地。"], "2": ["創 3:15", "Gen 3:15", "我又要叫你和女人彼此為仇；你的後裔和女人的後裔也彼此為仇。女人的後裔要傷你的頭；你要傷他的腳跟。"], "3": ["創 9:13", "Gen 9:13", "我把虹放在雲彩中，這就可作我與地立約的記號了。"], "4": ["創 15:5", "Gen 15:5", "於是領他走到外邊，說：「你向天觀看，數算眾星，能數得過來嗎？」又對他說：「你的後裔將要如此。」"], "5": ["創 22:8", "Gen 22:8", "亞伯拉罕說：「我兒，神必自己預備作燔祭的羊羔。」於是二人同行。"], "6": ["創 28:15", "Gen 28:15", "我也與你同在。你無論往哪裡去，我必保佑你，領你歸回這地，總不離棄你，直到我成全了向你所應許的。"], "7": ["創 37:3", "Gen 37:3", "以色列原來愛約瑟過於愛他的眾子，因為約瑟是他年老生的；他給約瑟做了一件彩衣。"], "8": ["創 50:20", "Gen 50:20", "從前你們的意思是要害我，但神的意思原是好的，要保全許多人的性命，成就今日的光景。"], "9": ["出 2:10", "Exod 2:10", "孩子漸長，婦人把他帶到法老的女兒那裡，就作了她的兒子。她給孩子起名叫摩西，意思說：「因我把他從水裡拉出來。」"], "10": ["出 3:5", "Exod 3:5", "神說：「不要近前來。當把你腳上的鞋脫下來，因為你所站之地是聖地」。"], "11": ["出 14:14", "Exod 14:14", "耶和華必為你們爭戰；你們只管靜默，不要作聲。"], "12": ["出 16:4", "Exod 16:4", "耶和華對摩西說：「我要將糧食從天降給你們。百姓可以出去，每天收每天的分，我好試驗他們遵不遵我的法度。"], "13": ["書 1:9", "Josh 1:9", "我豈沒有吩咐你嗎？你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華─你的神必與你同在。"], "14": ["士 16:28", "Judg 16:28", "參孫求告耶和華說：「主耶和華啊，求你眷念我。神啊，求你賜我這一次的力量，使我在非利士人身上報那剜我雙眼的仇。」"], "15": ["士 7:7", "Judg 7:7", "耶和華對基甸說：「我要用這舔水的三百人拯救你們，將米甸人交在你手中；其餘的人都可以各歸各處去。」"], "16": ["得 1:16", "Ruth 1:16", "路得說：「不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿；你的國就是我的國，你的神就是我的神。"], "17": ["撒上 3:10", "1 Sam 3:10", "耶和華又來站著，像前三次呼喚說：「撒母耳啊！撒母耳啊！」撒母耳回答說：「請說，僕人敬聽！」"], "18": ["撒上 15:22", "1 Sam 15:22", "撒母耳說：耶和華喜悅燔祭和平安祭，豈如喜悅人聽從他的話呢？聽命勝於獻祭；順從勝於公羊的脂油。"], "19": ["撒上 17:45", "1 Sam 17:45", "大衛對非利士人說：「你來攻擊我，是靠著刀槍和銅戟；我來攻擊你，是靠著萬軍之耶和華的名，就是你所怒罵帶領以色列軍隊的神。"], "20": ["撒上 24:6", "1 Sam 24:6", "對跟隨他的人說：「我的主乃是耶和華的受膏者，我在耶和華面前萬不敢伸手害他，因他是耶和華的受膏者。」"], "21": ["撒下 12:13", "2 Sam 12:13", "大衛對拿單說：「我得罪耶和華了！」拿單說：「耶和華已經除掉你的罪，你必不至於死。"], "22": ["王上 3:9", "1 Kgs 3:9", "所以求你賜我智慧，可以判斷你的民，能辨別是非。不然，誰能判斷這眾多的民呢？"], "23": ["代下 33:13", "2 Chr 33:13", "他祈禱耶和華，耶和華就允准他的祈求，垂聽他的禱告，使他歸回耶路撒冷，仍坐國位。瑪拿西這才知道惟獨耶和華是神。"], "24": ["王上 18:39", "1 Kgs 18:39", "眾民看見了，就俯伏在地，說：「耶和華是神！耶和華是神！」"], "25": ["王下 5:14", "2 Kgs 5:14", "於是乃縵下去，照著神人的話，在約旦河裡沐浴七回；他的肉復原，好像小孩子的肉，他就潔淨了。"], "26": ["拿 1:17", "Jonah 1:17", "耶和華安排一條大魚吞了約拿，他在魚腹中三日三夜。"], "27": ["賽 9:6", "Isa 9:6", "因有一嬰孩為我們而生；有一子賜給我們。政權必擔在他的肩頭上；他名稱為「奇妙策士、全能的神、永在的父、和平的君」。"], "28": ["耶 29:11", "Jer 29:11", "耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。"], "29": ["結 37:5", "Ezek 37:5", "主耶和華對這些骸骨如此說：『我必使氣息進入你們裡面，你們就要活了。"], "30": ["斯 4:14", "Esth 4:14", "此時你若閉口不言，猶大人必從別處得解脫，蒙拯救；你和你父家必致滅亡。焉知你得了王后的位分不是為現今的機會嗎？"], "31": ["但 1:8", "Dan 1:8", "但以理卻立志不以王的膳和王所飲的酒玷污自己，所以求太監長容他不玷污自己。"], "32": ["但 2:28", "Dan 2:28", "只有一位在天上的神能顯明奧祕的事。"], "33": ["但 3:17", "Dan 3:17", "即便如此，我們所事奉的神能將我們從烈火的窯中救出來。王啊，他也必救我們脫離你的手。"], "34": ["但 6:22", "Dan 6:22", "我的神差遣使者，封住獅子的口，叫獅子不傷我；因我在神面前無辜，我在王面前也沒有行過虧損的事。"], "35": ["尼 2:20", "Neh 2:20", "我回答他們說：「天上的神必使我們亨通。我們作他僕人的，要起來建造；你們卻在耶路撒冷無分、無權、無紀念。」"], "36": ["路 2:11", "Luke 2:11", "因今天在大衛的城裡，為你們生了救主，就是主基督。"], "37": ["太 3:3", "Matt 3:3", "這人就是先知以賽亞所說的。他說：「在曠野有人聲喊著說：預備主的道，修直他的路！」"], "38": ["太 4:4", "Matt 4:4", "耶穌卻回答說：「經上記著說：人活著，不是單靠食物，乃是靠神口裡所出的一切話。」"], "39": ["太 4:19", "Matt 4:19", "耶穌對他們說：「來跟從我，我要叫你們得人如得魚一樣。」"], "40": ["可 2:5", "Mark 2:5", "耶穌見他們的信心，就對癱子說：「小子，你的罪赦了。」"], "41": ["約 3:16", "John 3:16", "神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生。"], "42": ["太 7:24", "Matt 7:24", "所以，凡聽見我這話就去行的，好比一個聰明人，把房子蓋在磐石上。"], "43": ["太 13:23", "Matt 13:23", "撒在好地上的，就是人聽道明白了，後來結實，有一百倍的，有六十倍的，有三十倍的。"], "44": ["路 16:25", "Luke 16:25", "亞伯拉罕說：『兒啊，你該回想你生前享過福，拉撒路也受過苦；如今他在這裡得安慰，你倒受痛苦。"], "45": ["路 15:20", "Luke 15:20", "於是起來，往他父親那裡去。相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。"], "46": ["路 10:37", "Luke 10:37", "他說：「是憐憫他的。」耶穌說：「你去照樣行吧。」"], "47": ["約 4:14", "John 4:14", "人若喝我所賜的水就永遠不渴。我所賜的水要在他裡頭成為泉源，直湧到永生。"], "48": ["可 4:39", "Mark 4:39", "耶穌醒了，斥責風，向海說：「住了吧！靜了吧！」風就止住，大大地平靜了。"], "49": ["可 5:41", "Mark 5:41", "就拉著孩子的手，對她說：「大利大，古米！」（翻出來就是說：「閨女，我吩咐你起來！」）"], "50": ["約 9:25", "John 9:25", "他說：「他是個罪人不是，我不知道；有一件事我知道，從前我是眼瞎的，如今能看見了。」"], "51": ["約 6:35", "John 6:35", "耶穌說：「我就是生命的糧。到我這裡來的，必定不餓；信我的，永遠不渴。"], "52": ["約 11:25", "John 11:25", "耶穌對她說：「復活在我，生命也在我。信我的人雖然死了，也必復活。"], "53": ["路 19:10", "Luke 19:10", "人子來，為要尋找、拯救失喪的人。"], "54": ["太 28:6", "Matt 28:6", "他不在這裡，照他所說的，已經復活了。你們來看安放主的地方。"], "55": ["徒 1:8", "Acts 1:8", "但聖靈降臨在你們身上，你們就必得著能力，並要在耶路撒冷、猶太全地，和撒馬利亞，直到地極，作我的見證。"], "56": ["徒 8:4", "Acts 8:4", "那些分散的人往各處去傳道。"], "57": ["徒 12:5", "Acts 12:5", "於是彼得被囚在監裡；教會卻為他切切地禱告神。"], "58": ["徒 9:20", "Acts 9:20", "就在各會堂裡宣傳耶穌，說他是神的兒子。"], "59": ["提後 4:7", "2 Tim 4:7", "那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。"], "60": ["啟 21:4", "Rev 21:4", "神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。"], "61": ["啟 1:7", "Rev 1:7", "看哪，他駕雲降臨！眾目要看見他，連刺他的人也要看見他；地上的萬族都要因他哀哭。這話是真實的。阿們！"]};

const SIZE = 4.6, RAD = 4.22, TOP = .55;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function ring(k){ let q=DIRS[4][0]*k, r=DIRS[4][1]*k; const out=[]; for(let i=0;i<6;i++) for(let j=0;j<k;j++){ out.push([q,r]); q+=DIRS[i][0]; r+=DIRS[i][1]; } return out; }
const hd=(a,b)=>(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[0]+a[1]-b[0]-b[1]))/2;
const axial=([q,r])=>new THREE.Vector3(SIZE*Math.sqrt(3)*(q+r/2),0,SIZE*1.5*r);
const r2=ring(2), r1=ring(1);
let start=r1.findIndex(h=>hd(h,r2[7])===1);
const r1o=[...r1.slice(start),...r1.slice(0,start)];
const coords=[...r2.slice(0,8),...r1o,[0,0]];
const decor=r2.slice(8);

let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
const SLOTS=[[0,0],[2.25,0],[-1.12,1.95],[-1.12,-1.95],[1.12,1.95],[1.12,-1.95],[-2.25,0]];
const SLOT_ORDER={1:[0],2:[2,5],3:[2,1,3],4:[2,4,5,3],5:[0,2,4,5,3],6:[2,4,1,5,3,6],7:[0,2,4,1,5,3,6]};

function makeHex(r, h, color, y){ const m=mesh(new THREE.CylinderGeometry(r,r,h,6),color,0,y,0); return m; }

ISL.forEach((isl,i)=>{
  const g=new THREE.Group(); const p=axial(coords[i]); g.position.copy(p); islandsGroup.add(g);
  isl.group=g; isl.base=p.clone(); isl.phase=i*.9; isl.sink=0; isl.sinkTarget=0;
  g.add(makeHex(RAD*.97,1.1,"#9a6a45",-.95)); g.add(makeHex(RAD,.5,"#c99460",-.15));
  const top=makeHex(RAD*1.01,.28,isl.home?"#f3dca0":isl.top,TOP-.14); top.userData.island=i; g.add(top); pickables.push(top);
  const foam=mesh(new THREE.CylinderGeometry(RAD+.35,RAD+.35,.05,6,1,true),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.5,side:THREE.DoubleSide}),0,.03,0,g); foam.castShadow=false;
  const order=SLOT_ORDER[isl.ids.length]; const used=[];
  isl.ids.forEach((id,j)=>{
    const s=SLOTS[order[j]]; const b=new THREE.Group(); b.position.set(s[0],TOP,s[1]);
    const toCenter=Math.atan2(-s[0],-s[1]); b.rotation.y=(s[0]===0&&s[1]===0)?0:toCenter;
    const c=TOY[(id*3)%TOY.length]; (BUILD[STORY[id].kind]||BUILD.house)(b,c);
    b.userData.sid=id; g.add(b); pickables.push(b); storyObj[id]=b; used.push(s);
    b.traverse(o=>{ if(o.userData.flame||o.userData.star||o.userData.lamp) animated.push(o); });
  });
  // 裝飾樹
  let tries=0, n=isl.home?4:6;
  while(n>0 && tries<200){ tries++; const a=rnd()*Math.PI*2, rr=1+rnd()*2.4; const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    if(used.some(s=>Math.hypot(s[0]-x,s[1]-z)<1.35)) continue; used.push([x,z]); n--;
    if(isl.home) ball(.3+rnd()*.2,WHITE,x,TOP+.3,z,g,1); else if(rnd()<.75) treeAt(g,x,z,.55+rnd()*.35,["#4f9a5c","#3f8a52","#6db36a","#5aa35e"][Math.floor(rnd()*4)]); else ball(.16,STONE,x,TOP+.08,z,g); }
  if(isl.rainbow){ const cols=["#e86a57","#f08a4b","#f2b843","#6fc39b","#5b9fe0","#9c89d9"]; cols.forEach((c,k)=>{ const t=mesh(new THREE.TorusGeometry(2.6-k*.13,.07,6,40,Math.PI),new THREE.MeshStandardMaterial({color:c,roughness:.6,flatShading:true,transparent:true,opacity:.85}),0,TOP,-3.3,g); t.castShadow=false; }); }
  if(isl.home){ const h=new THREE.PointLight(0xffd36b,.0,14); h.position.set(0,3,0); g.add(h); isl.halo=h; }
});

    <div class="eyebrow">${numTag(id)}<span class="pill ${isNT(id)?"nt":"ot"}">${isNT(id)?"新約":"舊約"}</span><span>${esc(s.yr)}</span>${id===TODAY?'<span class="pill">今日故事</span>':""}</div>
    <h2>${Z(s.t,ZY.t[id])}</h2>
    <p class="lede">${Z(s.sum,ZY.s[id])}</p>
    ${id===60?`<h3 class="part">${Z("一、耶穌再來",ZY.h3[0])}</h3>`+verseHTML(STORY[61],61)+scenesHTML()+`<h3 class="part">${Z("二、新天新地",ZY.h3[1])}</h3><p class="lede">${Z("耶穌為我們預備地方；那裡不再有眼淚，神要與人同住。",ZY.ne)}</p>`:""}
    <figure class="verse">
      <blockquote>${Z(s.v[2],ZY.v[id])}</blockquote>
      <figcaption><span>${esc(s.v[0])}・和合本</span><a href="${verseUrl(s)}" target="_blank" rel="noopener">看上下文</a><button class="copy" data-copy="${id}">複製金句</button></figcaption>
    </figure>
    <div class="eyebrow"><span>故事經文段落：${esc(s.ref)}</span></div>
    ${peopleOf(id).length?`<h3>故事裡的人物</h3><div class="people">${peopleOf(id).map(([p,k])=>pchip(k)).join("")}</div>`:""}
    <div class="links">
      ${s.slug?`<a class="link" href="${pdf(s)}" target="_blank" rel="noopener">${ICON.book}<div><b>閱讀圖畫故事</b><span>兒童聖經故事 PDF・繁體中文</span></div></a>
      <a class="link" href="${pdf(s,true)}" target="_blank" rel="noopener">${ICON.pen}<div><b>下載著色本</b><span>可列印的彩圖 PDF</span></div></a>`:""}
      <a class="link" href="${bg(s)}" target="_blank" rel="noopener">${ICON.scroll}<div><b>讀整段和合本經文</b><span>${esc(s.ref)}</span></div></a>
    </div>
    ${links.length?`<h3>恩典線</h3><div class="list">${links.map(g=>{const o=g[0]===id?g[1]:g[0]; return `<button class="item" data-story="${o}">${numTag(o)}<b>${esc(STORY[o].t)}</b><span>${esc(g[2])}</span></button>`;}).join("")}</div>`:""}
    <div class="actions">${prevOf(id)?`<button class="btn" data-story="${prevOf(id)}">← ${navLabel(prevOf(id))}</button>`:""}${nextOf(id)?`<button class="btn primary" data-story="${nextOf(id)}">${navLabel(nextOf(id))} →</button>`:""}</div>`;
}
panel.addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]"); if(cp){ const s=STORY[+cp.dataset.copy]; const txt=`${s.v[2]}（${s.v[0]}，和合本）`;
    const done=()=>{ cp.textContent="已複製"; setTimeout(()=>cp.textContent="複製金句",1600); };
    const fallback=()=>{ const q=cp.closest(".verse").querySelector("blockquote"); const r=document.createRange(); r.selectNodeContents(q); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); cp.textContent="已選取，請按複製"; };
    try{ navigator.clipboard.writeText(txt).then(done,fallback); }catch(err){ fallback(); } return; }
  const pp=e.target.closest("[data-playperson]"); if(pp){ startPlay(PEOPLE[+pp.dataset.playperson][2]); return; }
  const pc=e.target.closest("[data-person]"); if(pc){ selectPerson(+pc.dataset.person); return; }
  if(e.target.closest("[data-people]")){ showPeople(); return; }
  const b=e.target.closest("[data-story],[data-isl],[data-home]"); if(!b) return;
  if(b.dataset.story) selectStory(+b.dataset.story); else if(b.dataset.isl){ clearPerson(); selectIsland(+b.dataset.isl); } else { clearPerson(); goHome(); } });
const zyBtn=document.getElementById("zyBtn");
function applyZy(){ zyBtn.setAttribute("aria-pressed",zyOn); panel.classList.toggle("zy",zyOn); }
function rerender(){ const v=view; if(v.type==="home") renderHome(); else if(v.type==="isl") renderIsland(v.id); else if(v.type==="story") renderStory(v.id); else if(v.type==="people") renderPeople(); else if(v.type==="person") renderPerson(v.id); }
zyBtn.addEventListener("click",()=>{ zyOn=!zyOn; try{ localStorage.setItem("grace-zy",zyOn?"1":"0"); }catch(e){} applyZy(); const st=panelBody.scrollTop; rerender(); panelBody.scrollTop=st; });
applyZy();
document.getElementById("peopleBtn").addEventListener("click",showPeople);
let personSel=null;
function showPeople(){ clearPerson(); setSelected(null); renderPeople(); panelBody.scrollTop=0; panel.classList.remove("collapsed"); }
function clearPerson(){ if(personSel===null) return; personSel=null; pins.forEach(p=>p.visible=false); Object.values(dots).forEach(d=>d.classList.remove("hit")); }
function selectPerson(k){ stopPlay(); qEl.value=""; resEl.hidden=true; personSel=k; setSelected(null);
  const ids=PEOPLE[k][2]; pins.forEach(p=>p.visible=false); Object.values(dots).forEach(d=>d.classList.remove("hit"));
  const box=new THREE.Box3();
  ids.forEach((id,i)=>{ const w=new THREE.Vector3(); storyObj[id].getWorldPosition(w); box.expandByPoint(w); const p=pins[i]; p.material=pinGold; p.position.set(w.x,w.y+2.4,w.z); p.userData.baseY=w.y+2.4; p.visible=true; dots[id].classList.add("hit"); });
  renderPerson(k); panelBody.scrollTop=0; panel.classList.remove("collapsed");
  const c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3()); flyTo(c,Math.max(22,Math.max(sz.x,sz.z)*1.5+18)); }
document.getElementById("handle").addEventListener("click",()=>panel.classList.toggle("collapsed"));

let selected=null;
function setSelected(id){ selected=id; syncTimeline(id); if(id){ const w=new THREE.Vector3(); storyObj[id].getWorldPosition(w); ringMark.position.set(w.x,w.y+.08,w.z); ringMark.visible=true; } else ringMark.visible=false; }
function selectStory(id,fly=true){ if(id===61) id=60; setSelected(id); renderStory(id); panelBody.scrollTop=0; panel.classList.remove("collapsed"); if(fly){ const w=new THREE.Vector3(); storyObj[id].getWorldPosition(w); if(id===60) w.y+=3; flyTo(w,id===60?34:20); } }
function selectIsland(i){ setSelected(null); renderIsland(i); panelBody.scrollTop=0; panel.classList.remove("collapsed"); flyTo(ISL[i].base.clone(),28); }
function goHome(){ setSelected(null); renderHome(); panelBody.scrollTop=0; flyTo(HOME.clone(),innerWidth<760?102:68); }

/* 鏡頭飛行 */
let fly=null;
function flyTo(target,dist){ const dir=camera.position.clone().sub(controls.target); dir.y=Math.max(dir.y,dir.length()*.55); dir.normalize();
  const toPos=target.clone().add(dir.multiplyScalar(dist));
  if(reduce){ controls.target.copy(target); camera.position.copy(toPos); return; }
  fly={t:0,fromT:controls.target.clone(),toT:target.clone(),fromP:camera.position.clone(),toP:toPos}; }

/* 島名標籤 */
const labelsEl=document.getElementById("labels");
ISL.forEach((s,i)=>{ const b=document.createElement("button"); b.className="isl"+(s.home?" home":""); b.innerHTML=`<span class="dot" style="background:${s.home?"#fff":s.top}"></span>${esc(s.name)} <small>${s.ids.length}</small>`; b.setAttribute("aria-label",`${s.name}，${s.ids.length} 則故事`);
  b.addEventListener("click",()=>selectIsland(i)); labelsEl.appendChild(b); s.label=b; });

/* 時間軸 */
const tlTrack=document.getElementById("tlTrack"), tlScroll=document.getElementById("tlScroll"), tlNow=document.getElementById("tlNow");
const dots={};
ERAS.forEach(([name,span,ids,col])=>{ const e=document.createElement("div"); e.className="era"; e.style.setProperty("--n",ids.length); e.style.setProperty("--era",col);
  const short=span==="約西元前5年–30年"?"西元前5年–30年":span.replace(/^約/,"").replace(/(\d)年/g,"$1");
  e.innerHTML=`<span title="${esc(name)}・${esc(span)}"><b>${esc(name)}</b><small>${esc(short)}</small></span><div class="dots"></div>`;
  const row=e.querySelector(".dots");
  ids.forEach(id=>{ const s=STORY[id]; const d=document.createElement("button"); d.className="dot"+(id===TODAY?" is-today":""); d.setAttribute("aria-label",`第 ${id} 則〈${s.t}〉${s.yr}`); d.title=`${id}. ${s.t}・${s.yr}`;
    d.addEventListener("click",()=>{ stopPlay(); selectStory(id); }); row.appendChild(d); dots[id]=d; });
  tlTrack.appendChild(e); });
function syncTimeline(id){ Object.values(dots).forEach(d=>d.classList.remove("on")); if(!id){ tlNow.innerHTML="點一個圓點，跳到那個年代的故事"; return; }
  const s=STORY[id], d=dots[id]; d.classList.add("on"); const era=ERAS[s.era];
  tlNow.innerHTML=`<b>${esc(s.yr)}</b>・${esc(era[0])}・${esc(s.t)}`;
  const L=d.offsetLeft-tlScroll.clientWidth/2; if(tlScroll.scrollWidth>tlScroll.clientWidth) tlScroll.scrollTo({left:L,behavior:reduce?"auto":"smooth"}); }
let playTimer=null; const playBtn=document.getElementById("playBtn"), playLabel=document.getElementById("playLabel"), playIcon=document.getElementById("playIcon");
function stopPlay(){ if(!playTimer) return; clearInterval(playTimer); playTimer=null; playBtn.classList.remove("playing"); playBtn.setAttribute("aria-pressed","false"); playLabel.textContent="依年代播放"; playIcon.setAttribute("d","M7 4l13 8-13 8z"); }
let playList=TL;
function step(){ const i=selected?playList.indexOf(selected):-1; if(i>=playList.length-1){ stopPlay(); return; } selectStory(playList[i+1]); }
function startPlay(list){ stopPlay(); playList=list?[...list].sort((a,b)=>TL.indexOf(a)-TL.indexOf(b)):TL; playBtn.classList.add("playing"); playBtn.setAttribute("aria-pressed","true"); playLabel.textContent="暫停"; playIcon.setAttribute("d","M6 4h4v16H6zM14 4h4v16h-4z");
  if(!playList.includes(selected)||selected===playList[playList.length-1]) setSelected(null); step(); playTimer=setInterval(step,4200); }
playBtn.addEventListener("click",()=>{ if(playTimer){ stopPlay(); return; } startPlay(personSel!==null?PEOPLE[personSel][2]:null); });

/* 篩選 */
let filter="all";
function setFilter(f){ filter=f; ["all","ot","nt"].forEach(k=>document.getElementById("f-"+k).setAttribute("aria-pressed",k===f));
  ISL.forEach(s=>{ const off=(f==="ot"&&s.nt)||(f==="nt"&&!s.nt); s.sinkTarget=off?-1.3:0; s.label.classList.toggle("dim",off); }); }
["all","ot","nt"].forEach(k=>document.getElementById("f-"+k).addEventListener("click",()=>setFilter(k)));

/* 恩典線開關 */
let graceAll=false; const graceBtn=document.getElementById("graceBtn");
graceBtn.addEventListener("click",()=>{ graceAll=!graceAll; graceBtn.setAttribute("aria-pressed",graceAll); });

/* 搜尋 */
function hl(t,q){ const i=t.toLowerCase().indexOf(q); const a=Math.max(0,i-14), b=Math.min(t.length,i+q.length+18); return (a>0?"…":"")+esc(t.slice(a,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length,b))+(b<t.length?"…":""); }
const qEl=document.getElementById("q"), resEl=document.getElementById("results");
let matches=[];
function doSearch(){ const q=qEl.value.trim().toLowerCase(); matches=[];
  if(!q){ resEl.hidden=true; if(personSel===null) pins.forEach(p=>p.visible=false); return; }
  pins.forEach(p=>p.visible=false);
  matches=S.map(a=>STORY[a[0]]).filter(s=>s.id!==61&&(s.t+s.sum+s.ref+s.v[0]+s.v[2]+ISL[s.isl].name+ISL[s.isl].era+(s.id===60?STORY[61].ref+STORY[61].v[2]+SCENES.map(c=>c[0]+c[2][2]).join(""):"")).toLowerCase().includes(q));
  personSel=null; Object.values(dots).forEach(d=>d.classList.remove("hit"));
  matches.forEach((s,i)=>{ const p=pins[i]; p.material=pinMat; const w=new THREE.Vector3(); storyObj[s.id].getWorldPosition(w); p.position.set(w.x,w.y+2.4,w.z); p.userData.baseY=w.y+2.4; p.visible=true; });
  resEl.innerHTML=matches.length? `<div class="results-head" style="padding:4px 10px;font-size:12px;color:var(--ink-soft)">找到 ${matches.length} 則故事，島上的藍色圖釘標出位置</div>`+matches.slice(0,12).map(s=>`<button data-story="${s.id}">${numTag(s.id)}<span class="t">${esc(s.t)}</span><span class="s">${esc(ISL[s.isl].name)}・${esc(s.yr)}</span>${s.v[2].toLowerCase().includes(q)?`<span class="v">${hl(s.v[2],q)}（${esc(s.v[0])}）</span>`:""}</button>`).join("")
    : `<div class="empty">沒有找到「${esc(qEl.value)}」。試試人物名字，例如「摩西」「彼得」，或主題如「禱告」「饒恕」。</div>`;
  resEl.hidden=false; }
qEl.addEventListener("input",doSearch);
qEl.addEventListener("keydown",e=>{ if(e.key==="Enter"&&matches[0]){ selectStory(matches[0].id); resEl.hidden=true; } if(e.key==="Escape"){ qEl.value=""; doSearch(); } });
resEl.addEventListener("click",e=>{ const b=e.target.closest("[data-story]"); if(b){ selectStory(+b.dataset.story); resEl.hidden=true; } });
document.addEventListener("pointerdown",e=>{ if(!e.target.closest(".search")) resEl.hidden=true; });
qEl.addEventListener("focus",()=>{ if(qEl.value.trim()) resEl.hidden=false; });

/* 小羊 */
const lambNote=document.getElementById("lambNote");
document.getElementById("lambBtn").addEventListener("click",()=>{ flyTo(lamb.position.clone(),14); if(lambVisit) lambNote.textContent=`小羊正在聽〈${STORY[lambVisit].t}〉`; });

/* 點擊與滑過 */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=document.getElementById("tip");
function pick(e){ const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables,true)[0]; if(!hit) return null; let o=hit.object; while(o){ if(o.userData.sid) return {sid:o.userData.sid}; if(o.userData.lamb) return {lamb:true}; if(o.userData.island!==undefined) return {isl:o.userData.island}; o=o.parent; } return null; }
let down=null;
canvas.addEventListener("pointerdown",e=>{ down={x:e.clientX,y:e.clientY}; fly=null; stopPlay(); });
canvas.addEventListener("pointerup",e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(moved>6) return;
  const h=pick(e); if(!h) return; if(h.sid) selectStory(h.sid); else if(h.lamb){ if(lambVisit) selectStory(lambVisit); } else if(h.isl!==undefined) selectIsland(h.isl); });
canvas.addEventListener("pointermove",e=>{ if(e.pointerType!=="mouse"||e.buttons) { tip.hidden=true; return; } const h=pick(e);
  canvas.classList.toggle("hovering",!!h);
  if(h&&h.sid){ const s=STORY[h.sid]; tip.innerHTML=`${esc(s.t)}<small>${esc(ISL[s.isl].name)}・${esc(s.ref)}</small>`; tip.style.left=e.clientX+"px"; tip.style.top=e.clientY+"px"; tip.hidden=false; }
  else if(h&&h.lamb){ tip.innerHTML=`小羊<small>${lambVisit?`正在聽〈${esc(STORY[lambVisit].t)}〉，點我一起看`:"正在過橋"}</small>`; tip.style.left=e.clientX+"px"; tip.style.top=e.clientY+"px"; tip.hidden=false; }
  else tip.hidden=true; });
canvas.addEventListener("pointerleave",()=>{ tip.hidden=true; });

/* 尺寸 */
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  if(w<760){ camera.fov=48; } else camera.fov=34; camera.updateProjectionMatrix(); }
addEventListener("resize",resize); resize();
const HOME=innerWidth<760?new THREE.Vector3(0,0,8):new THREE.Vector3(7,0,1);
if(innerWidth<760){ camera.position.set(4,74,72); } else camera.position.set(13,44,51);
controls.target.copy(HOME);

/* ---------------- 動畫迴圈 ---------------- */
const clock=new THREE.Clock(); const tmp=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  // 海浪
  const arr=seaPos.array; for(let i=0;i<arr.length;i+=3){ const x=seaBase[i], z=seaBase[i+2]; arr[i+1]=reduce?0:Math.sin(x*.18+t*.9)*.12+Math.cos(z*.22+t*.7)*.1; } seaPos.needsUpdate=true;
  // 島嶼浮動與下沉
  ISL.forEach(s=>{ s.sink+=(s.sinkTarget-s.sink)*Math.min(1,dt*3); s.group.position.y=(reduce?0:Math.sin(t*.6+s.phase)*.06)+s.sink; });
  // 火焰、星星、燈
  animated.forEach((o,i)=>{ if(o.userData.flame){ o.scale.y=1+Math.sin(t*9+i)*.15; } if(o.userData.star){ o.rotation.y=t*1.2; o.position.y+=Math.sin(t*2)*.002; } if(o.userData.lamp){ o.material=glowMat; } });
  glowMat.emissiveIntensity=.6+night*1.4;
  todayStar.rotation.y=t*1.5; todayStar.position.y=todayStar.userData.baseY+Math.sin(t*2)*.2;
  pins.forEach((p,i)=>{ if(p.visible) p.position.y=p.userData.baseY+Math.abs(Math.sin(t*3+i*.4))*.35; });
  ringMark.scale.setScalar(1+Math.sin(t*3)*.06);
  // 恩典線
  graceLines.forEach(g=>{ const want=(selected&&(g.a===selected||g.b===selected))?1:graceAll?.6:0; g.on+=(want-g.on)*Math.min(1,dt*4);
    g.tube.material.opacity=g.on*.85; g.tube.visible=g.on>.01; g.dot.visible=g.on>.01; g.dot.material.opacity=g.on;
    g.t=(g.t+dt*.22)%1; g.curve.getPoint(g.t,tmp); g.dot.position.copy(tmp); });
  // 小羊
  if(lambWait>0){ lambWait-=dt; } else {
    const a=route[lambSeg].p, b=route[(lambSeg+1)%route.length].p; const len=a.distanceTo(b);
    if(lambSeg===route.length-1){ lambSeg=0; lambT=0; lamb.position.copy(route[0].p); }
    else { lambT+=dt*1.5/len; if(lambT>=1){ lambT=0; lambSeg++; const r=route[lambSeg]; if(r.id){ lambWait=2.6; lambVisit=r.id; lambNote.textContent=`小羊正在聽〈${STORY[r.id].t}〉`; } else { lambVisit=null; lambNote.textContent="小羊正在過橋…"; } }
      lamb.position.lerpVectors(a,b,lambT); lamb.rotation.y=Math.atan2(b.x-a.x,b.z-a.z); } }
  const isl=lambVisit?ISL[STORY[lambVisit].isl]:null; lamb.position.y=TOP+(isl?isl.group.position.y:0)+(lambWait>0?Math.abs(Math.sin(t*5))*.12:0);
  lamb.userData.legs.forEach((l,i)=>{ l.rotation.x=lambWait>0?0:Math.sin(t*12+i*Math.PI)*.5; });
  // 耶穌再來畫面（平和、溫暖）
  { const want=selected===60?1:0; RET.e+=(want-RET.e)*Math.min(1,dt*.7); const e=RET.e;
    RET.j.position.y=1.3+Math.sin(t*.8)*.06; RET.rays.rotation.z=t*.04; RET.angels.rotation.y=t*.08;
    RET.angels.children.forEach((a,i)=>{ const u=a.userData; a.position.set(Math.cos(u.ang)*u.r,u.h+Math.sin(t*.9+i)*.1,Math.sin(u.ang)*u.r); a.rotation.y=-u.ang-t*.08+Math.PI; });
    RET.cone.material.opacity=.04+e*.1; RET.halo.material.opacity=.18+e*.22; RET.rays.children.forEach(r=>r.material.opacity=.14+e*.2);
    RET.light.intensity=e*1.2;
    RET.rings.forEach(r=>{ const k=((t*.18)+r.userData.off)%1; r.scale.setScalar(1+k*5); r.material.opacity=e*(1-k)*.22; r.visible=e>.02; });
    sun.intensity=baseSun*(1-.12*e); hemi.intensity=baseHemi*(1+.15*e); seaMat.color.copy(baseSea).lerp(new THREE.Color(0xf3dcb0),e*.22);
    starMat.opacity=baseStar;
    document.getElementById("skyFx").style.opacity=e*.7; labelsEl.style.opacity=1-e*.5;
    const cp=new THREE.Vector3(); RET.g.getWorldPosition(cp);
    riseMat.opacity=e*.75; rise.forEach((m,i)=>{ m.visible=e>.02&&i%2===0; if(!m.visible) return; const u=m.userData; u.t=(u.t+dt*.06)%1; const k=u.t; m.position.set(u.sx+(cp.x-u.sx)*k*k, TOP+(cp.y-TOP)*k+Math.sin(t+i)*.1, u.sz+(cp.z-u.sz)*k*k); });
    falls.forEach(m=>m.visible=false);
  }
  // 鏡頭
  if(fly){ fly.t=Math.min(1,fly.t+dt/1.1); const e=fly.t<.5?2*fly.t*fly.t:1-Math.pow(-2*fly.t+2,2)/2; controls.target.lerpVectors(fly.fromT,fly.toT,e); camera.position.lerpVectors(fly.fromP,fly.toP,e); if(fly.t>=1) fly=null; }
  controls.update();
  
  renderer.render(scene,camera);
  // 標籤投影
  const W=innerWidth, H=innerHeight;
  ISL.forEach(s=>{ tmp.copy(s.base); tmp.y=s.group.position.y+(s.home?4.6:3.4); tmp.project(camera);
    const vis=tmp.z<1 && tmp.x>-1.2 && tmp.x<1.2 && tmp.y>-1.2 && tmp.y<1.2; s.label.hidden=!vis;
    if(vis) s.label.style.transform=`translate(${(tmp.x*.5+.5)*W}px,${(-tmp.y*.5+.5)*H}px) translate(-50%,-100%)`; });
  requestAnimationFrame(frame);
}

renderHome(); tick(); setInterval(tick,30000);
frame();
})();
</script>
